name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (no torch, no datasets)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src api tests
      - name: Test (fake model, tiny in-test corpus, no downloads)
        run: pytest --cov=sentiment --cov=api --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sentiment-api:ci .
      - name: Start without a model and expect a degraded health check
        run: |
          docker run -d --name api -p 8000:8000 sentiment-api:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
            [ "$code" = "503" ] && echo "health=503 as expected (no model mounted)" && exit 0
            sleep 2
          done
          docker logs api
          exit 1
