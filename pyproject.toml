[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sentiment-api"
version = "2.0.0"
description = "IMDB sentiment: TF-IDF baseline and fine-tuned DistilBERT, evaluated on the held-out test set and served with FastAPI."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sherie Lin" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
train = [
    "datasets>=2.19",
    "transformers>=4.46",
    "torch>=2.2",
    "accelerate>=0.26",
    "matplotlib>=3.8",
]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "transformers>=4.46", "torch>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "fastapi>=0.110", "ruff>=0.5"]

[project.scripts]
sentiment-baseline = "sentiment.baseline:main"
sentiment-train = "sentiment.train:main"
sentiment-evaluate = "sentiment.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sentiment", "api"]
